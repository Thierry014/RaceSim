<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCI Races</title>
</head>
<body>
    <h1>UCI Races</h1>

    {% if races %}
        <ul>
        {% for race in races %}
            <li>
                <strong>{{ race.name }}</strong> - {{ race.date }}
                ({{ race.location }}, {{ race.category }})
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No races found.</p>
    {% endif %}
</body>
</html>
